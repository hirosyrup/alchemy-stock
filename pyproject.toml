[project]
name = "alchemy-stock"
version = "0.1.0"
description = "適時開示を読んで日本株を売買する仕組みの研究"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=2.0.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-storage>=3.17.1",
    "lxml>=5.0",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0"]
extract = [
    "docling>=2.145.0",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alchemy_stock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
